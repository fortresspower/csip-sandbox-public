<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fortress CSIP Sandbox Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --c-accent:#1B9E4B; --c-accent-d:color-mix(in oklab, var(--c-accent) 82%, #000);
  --c-accent-t:color-mix(in oklab, var(--c-accent) 12%, #fff);
  --c-green:#1B9E4B; --c-amber:#C2740C; --c-blue:#2563EB; --c-violet:#7A5AE0; --c-red:#DC2626; --c-soc:#0E9488;
  --c-bg:#F4F6F5; --c-surface:#FFFFFF; --c-surface-2:#FAFBFA;
  --c-border:#E4E8E6; --c-border-strong:#D3D9D6;
  --c-text:#15201B; --c-text-2:#3B4642; --c-muted:#6C7773; --c-faint:#9BA49F;
  --c-ink:#0C1F16;
  --r:11px; --r-sm:7px; --r-xs:5px;
  --sh-1:0 1px 2px rgba(16,32,24,.04), 0 1px 3px rgba(16,32,24,.05);
  --sh-2:0 4px 16px rgba(16,32,24,.07), 0 1px 3px rgba(16,32,24,.05);
  --pad:20px; --gap:18px; --fs:15px; --row:38px;
  --ui:'Hanken Grotesk', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root[data-density="compact"]{ --pad:14px; --gap:12px; --fs:13.5px; --row:32px; }
:root[data-density="comfy"]{ --pad:26px; --gap:24px; --fs:15.5px; --row:42px; }
:root[data-type="system"]{ --ui:system-ui, -apple-system, 'Segoe UI', sans-serif; }
:root[data-mono="off"] .mono, :root[data-mono="off"] .q-mrid{ font-family:var(--ui); }

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:var(--ui); font-size:var(--fs); color:var(--c-text); background:var(--c-bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
.mono{ font-family:var(--mono); font-variant-ligatures:none; }
.small{ font-size:.82em; } .dim{ color:var(--c-muted); }
h3,p{ margin:0; }
.icn{ flex:none; }
button{ font-family:inherit; }

/* ---------------- shell ---------------- */
.app{ display:flex; flex-direction:column; height:100vh; }
.topbar{ display:flex; align-items:center; gap:16px; height:60px; padding:0 18px; flex:none;
  background:var(--c-surface); border-bottom:1px solid var(--c-border); z-index:20; }
.tb-spacer{ flex:1; }
.tb-right{ display:flex; align-items:center; gap:12px; }
.shell{ flex:1; display:flex; min-height:0; }
.content{ flex:1; min-width:0; overflow-y:auto; padding:var(--gap); container-type:inline-size; }

/* logo */
.logo{ display:flex; align-items:center; gap:10px; }
.logo-mark{ display:block; width:32px; height:32px; object-fit:contain; }
.logo-tx{ display:flex; flex-direction:column; }
.logo-1{ font-weight:800; font-size:14px; letter-spacing:.06em; color:var(--c-text); white-space:nowrap; line-height:1.15; }
.logo-2{ font-size:11.5px; color:var(--c-muted); letter-spacing:.02em; margin-top:1px; white-space:nowrap; line-height:1.15; }

/* site chip + mode pill */
.sitechip{ display:flex; align-items:center; gap:7px; padding:5px 11px; border:1px solid var(--c-border);
  border-radius:99px; color:var(--c-text-2); font-size:12.5px; background:var(--c-surface-2); }
.modepill{ display:flex; align-items:center; gap:8px; padding:5px 12px; border-radius:99px;
  border:1px solid var(--c-border); background:var(--c-surface-2); }
.modepill[data-mode="live"]{ border-color:color-mix(in oklab,var(--c-green) 40%,var(--c-border)); background:color-mix(in oklab,var(--c-green) 8%,#fff); }
.mp-t{ font-weight:700; font-size:12px; letter-spacing:.08em; }
.mp-d{ font-size:11.5px; color:var(--c-muted); }

/* status dot */
.sdot{ width:8px; height:8px; border-radius:99px; background:var(--c-faint); display:inline-block; flex:none; }
.sdot.ok{ background:var(--c-green); } .sdot.off{ background:var(--c-faint); }
.sdot.pulse.ok{ box-shadow:0 0 0 0 color-mix(in oklab,var(--c-green) 60%,transparent); animation:pulse 2s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--c-green) 55%,transparent);} 70%{box-shadow:0 0 0 6px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }

/* ---------------- nav (top) ---------------- */
.nav-top{ display:flex; gap:3px; }
.nav-i{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--r-sm);
  border:none; background:none; color:var(--c-text-2); font-size:14px; font-weight:500; cursor:pointer;
  white-space:nowrap; transition:background .12s, color .12s; }
.nav-i:hover{ background:var(--c-surface-2); color:var(--c-text); }
.nav-top .nav-i{ padding:8px 13px; }
.nav-top .nav-i.on{ color:var(--c-accent-d); background:var(--c-accent-t); font-weight:600; }

/* wire rail (console) */
.wirerail{ width:384px; flex:none; background:var(--c-surface); border-left:1px solid var(--c-border);
  display:flex; flex-direction:column; min-height:0; }
.wr-head{ display:flex; align-items:center; gap:8px; padding:13px 16px; border-bottom:1px solid var(--c-border);
  font-weight:600; font-size:13px; color:var(--c-text); }

/* ---------------- cards ---------------- */
.card{ background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--r); box-shadow:var(--sh-1); overflow:hidden; }
.card-h{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:var(--pad) var(--pad) 0; }
.card-t{ font-size:15px; font-weight:700; letter-spacing:-.01em; line-height:1.25; }
.card-s{ font-size:12.5px; color:var(--c-muted); margin-top:3px; }
.card-r{ flex:none; display:flex; align-items:center; gap:8px; }
.card-b{ padding:var(--pad); } .card-b.np{ padding:0; }
.card[data-accent="danger"]{ border-color:color-mix(in oklab,var(--c-red) 30%,var(--c-border)); }

/* ---------------- buttons ---------------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:var(--r-sm);
  border:1px solid var(--c-border-strong); background:var(--c-surface); color:var(--c-text); cursor:pointer;
  font-weight:600; font-size:13.5px; padding:0 14px; height:var(--row); transition:all .12s; white-space:nowrap; }
.btn:hover{ background:var(--c-surface-2); border-color:var(--c-muted); }
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-sm{ height:30px; padding:0 10px; font-size:12.5px; }
.btn-primary{ background:var(--c-accent); border-color:var(--c-accent); color:#fff; }
.btn-primary:hover{ background:var(--c-accent-d); border-color:var(--c-accent-d); }
.btn-danger{ background:#fff; border-color:color-mix(in oklab,var(--c-red) 45%,var(--c-border)); color:var(--c-red); }
.btn-danger:hover{ background:color-mix(in oklab,var(--c-red) 8%,#fff); }
.btn-ghost{ background:var(--c-surface-2); border-color:var(--c-border); color:var(--c-text-2); font-weight:500; }
.btn-ghost:hover{ background:#fff; border-color:var(--c-border-strong); color:var(--c-text); }

/* ---------------- fields ---------------- */
.field{ display:flex; flex-direction:column; gap:6px; }
.field-l{ font-size:12.5px; font-weight:600; color:var(--c-text-2); }
.field-h{ font-size:11.5px; color:var(--c-faint); }
.inp{ height:var(--row); border:1px solid var(--c-border-strong); border-radius:var(--r-sm); padding:0 11px;
  font-family:var(--ui); font-size:14px; color:var(--c-text); background:var(--c-surface); width:100%; }
.inp:focus{ outline:none; border-color:var(--c-accent); box-shadow:0 0 0 3px var(--c-accent-t); }
input[type=number].inp{ font-family:var(--mono); }
.range{ -webkit-appearance:none; appearance:none; height:6px; border-radius:99px; background:var(--c-border); width:100%; }
.range::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:99px; background:var(--c-accent); border:2px solid #fff; box-shadow:var(--sh-1); cursor:pointer; }
.range::-moz-range-thumb{ width:16px; height:16px; border-radius:99px; background:var(--c-accent); border:2px solid #fff; cursor:pointer; }
.unit{ font-family:var(--mono); font-size:12.5px; color:var(--c-muted); }

/* segmented */
.seg{ display:inline-flex; background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--r-sm); padding:3px; gap:2px; }
.seg-b{ display:inline-flex; align-items:center; gap:6px; border:none; background:none; cursor:pointer;
  padding:5px 11px; border-radius:5px; font-size:12.5px; font-weight:600; color:var(--c-muted); transition:all .12s; }
.seg-b:hover{ color:var(--c-text); }
.seg-b.on{ background:var(--c-surface); color:var(--c-accent-d); box-shadow:var(--sh-1); }

/* toggle */
.tgl{ display:inline-flex; align-items:center; gap:9px; border:none; background:none; cursor:pointer; padding:0; }
.tgl-k{ width:38px; height:22px; border-radius:99px; background:var(--c-border-strong); position:relative; transition:background .15s; flex:none; }
.tgl-k::after{ content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:99px; background:#fff; box-shadow:var(--sh-1); transition:transform .15s; }
.tgl.on .tgl-k{ background:var(--c-accent); }
.tgl.on .tgl-k::after{ transform:translateX(16px); }
.tgl-l{ font-size:13px; color:var(--c-text-2); }

/* badges */
.badge{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:99px; line-height:1.5; white-space:nowrap; }
.badge.xs{ font-size:10.5px; padding:1px 7px; font-family:var(--mono); font-weight:600; }
.tone-neutral{ background:var(--c-surface-2); color:var(--c-text-2); border:1px solid var(--c-border); }
.tone-green{ background:color-mix(in oklab,var(--c-green) 12%,#fff); color:var(--c-accent-d); }
.tone-amber{ background:color-mix(in oklab,var(--c-amber) 14%,#fff); color:var(--c-amber); }
.tone-blue{ background:color-mix(in oklab,var(--c-blue) 11%,#fff); color:var(--c-blue); }
.tone-violet{ background:color-mix(in oklab,var(--c-violet) 12%,#fff); color:var(--c-violet); }
.tone-red{ background:color-mix(in oklab,var(--c-red) 11%,#fff); color:var(--c-red); }
.tier-req{ background:color-mix(in oklab,var(--c-green) 13%,#fff); color:var(--c-accent-d); }
.tier-opt{ background:color-mix(in oklab,var(--c-blue) 11%,#fff); color:var(--c-blue); }
.tier-off{ background:#F1F0EE; color:var(--c-muted); }

/* stat */
.stat-l{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--c-faint); font-weight:600; }
.stat-v{ font-size:22px; font-weight:700; font-family:var(--mono); letter-spacing:-.02em; margin-top:3px; display:flex; align-items:baseline; gap:5px; }
.stat-u{ font-size:13px; color:var(--c-muted); font-weight:500; }
.stat.big .stat-v{ font-size:28px; }
.stat-sub{ font-size:12px; color:var(--c-muted); margin-top:2px; }
.stat[data-tone="amber"] .stat-v{ color:var(--c-amber); }
.stat[data-tone="green"] .stat-v{ color:var(--c-accent-d); }

/* chart + legend */
.chart{ width:100%; }
.legend{ display:flex; gap:14px; }
.legend-i{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--c-muted); font-family:var(--mono); }
.legend-s{ width:11px; height:3px; border-radius:2px; }

/* code */
.code{ background:#0E1A14; border-radius:var(--r-sm); padding:13px 15px; overflow-x:auto; margin:0;
  font-family:var(--mono); font-size:12px; line-height:1.55; color:#C8D6CE; }
.code code{ white-space:pre-wrap; word-break:break-word; }
.t-tag{ color:#7FD6A0; } .t-attr{ color:#E0B257; } .t-str{ color:#9CC6F0; } .t-txt{ color:#E7EFE9; }
.t-key{ color:#7FD6A0; } .t-num{ color:#E0A0C0; } .t-kw{ color:#E0B257; }

/* table */
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--c-faint);
  font-weight:600; padding:0 12px 9px; border-bottom:1px solid var(--c-border); }
.tbl td{ padding:10px 12px; border-bottom:1px solid var(--c-border); vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:none; }
.tbl .r{ text-align:right; } .tbl .c{ text-align:center; }
.tbl tbody tr:hover{ background:var(--c-surface-2); }
.row-off{ opacity:.6; }
.u-tag{ font-family:var(--mono); font-size:11px; color:var(--c-faint); margin-left:7px; border:1px solid var(--c-border); border-radius:4px; padding:0 5px; }
.map{ color:var(--c-text-2); font-size:12.5px; }
.dash{ color:var(--c-faint); }

/* empty */
.empty{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:30px 16px; text-align:center; color:var(--c-faint); }
.empty-t{ font-weight:600; color:var(--c-text-2); font-size:13.5px; }
.empty-s{ font-size:12.5px; color:var(--c-muted); max-width:380px; }
.prose{ font-size:13.5px; color:var(--c-text-2); line-height:1.6; }

/* ============ DISPATCH ============ */
.grid-dispatch{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:var(--gap); align-items:start; }
.dispatch-side{ display:flex; flex-direction:column; gap:var(--gap); min-width:0; }
.presets{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px; }
.compose-grid{ display:grid; grid-template-columns:160px 1fr; gap:14px; align-items:end; margin-bottom:16px; }
.compose-head{ display:flex; flex-direction:column; gap:14px; margin-bottom:16px; }
.mode-row{ border-top:1px solid var(--c-border); padding:14px 0; }
.mode-head{ display:flex; align-items:center; gap:12px; }
.mode-t{ font-family:var(--mono); font-size:13.5px; font-weight:600; }
.mode-s{ font-size:12px; color:var(--c-muted); margin-top:1px; }
.mode-ctl{ display:flex; align-items:center; gap:12px; margin-top:13px; padding-left:50px; }
.compose-foot{ display:flex; align-items:center; gap:14px; border-top:1px solid var(--c-border); padding-top:16px; margin-top:2px; }
.flash{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
.flash.ok{ color:var(--c-accent-d); } .flash.err{ color:var(--c-red); }
.preview{ margin-top:16px; }
.preview-l{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--c-faint); font-weight:600; margin-bottom:8px; }

.live-hero{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 2px 14px; }
.live-power{ display:flex; align-items:baseline; gap:8px; }
.lp-v{ font-family:var(--mono); font-size:42px; font-weight:700; letter-spacing:-.03em; line-height:1; }
.lp-u{ font-size:18px; color:var(--c-muted); font-weight:600; }
.live-hero[data-tone="amber"] .lp-v{ color:var(--c-amber); }
.live-hero[data-tone="green"] .lp-v{ color:var(--c-accent-d); }
.live-spark{ margin:0 -4px 16px; }
.live-stats{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; padding-top:16px; border-top:1px solid var(--c-border); }
.live-meta{ margin-top:16px; padding-top:14px; border-top:1px solid var(--c-border); display:flex; flex-direction:column; gap:9px; }
.live-meta > div{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.lm-k{ font-size:12.5px; color:var(--c-muted); } .lm-v{ font-size:12.5px; font-weight:600; text-align:right; white-space:nowrap; }
.lm-v.mono{ font-size:12px; }
.queue{ display:flex; flex-direction:column; gap:8px; }
.queue-i{ display:flex; align-items:center; gap:12px; padding:9px 12px; background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--r-sm); }
.q-mrid{ font-weight:600; font-size:13px; min-width:78px; } .q-modes{ display:flex; gap:6px; flex-wrap:wrap; }

/* ============ TELEMETRY (reader) ============ */
.grid-reader{ display:flex; flex-direction:column; gap:var(--gap); }
.read-compose{ display:flex; flex-direction:column; gap:12px; }
.read-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.selchips{ display:flex; flex-wrap:wrap; gap:6px; }
.selchip{ display:flex; align-items:center; gap:6px; font-size:12px; border:1px solid var(--c-border-strong); border-radius:99px; padding:2px 9px; background:var(--c-surface-2); }
.selchip.ext{ border-color:color-mix(in oklab,var(--c-violet) 28%,#fff); background:color-mix(in oklab,var(--c-violet) 7%,#fff); color:var(--c-violet); }
.selchip .x{ cursor:pointer; color:var(--c-faint); } .selchip .x:hover{ color:var(--c-text); }
.read-params{ display:flex; gap:14px; flex-wrap:wrap; }
.read-meta{ display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12px; color:var(--c-muted); }
.read-meta .sp{ margin-left:auto; }
.span-reqprev{ grid-column:1/-1; }

/* ============ CATALOG ============ */
.grid-catalog{ display:flex; flex-direction:column; gap:var(--gap); }
.span-full{ width:100%; }
.inline-mrid{ font-family:var(--mono); font-size:.92em; background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:4px; padding:1px 5px; color:var(--c-accent-d); }

/* toolbar: filters toggle + search */
.cat-toolbar{ display:flex; align-items:center; gap:14px; }
.filters-toggle{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--c-border-strong); background:var(--c-surface);
  border-radius:var(--r-sm); height:var(--row); padding:0 13px; font-size:13.5px; font-weight:600; color:var(--c-text-2); cursor:pointer; white-space:nowrap; }
.filters-toggle:hover{ background:var(--c-surface-2); }
.ft-n{ font-size:11.5px; font-weight:700; color:var(--c-accent-d); background:var(--c-accent-t); border-radius:99px; padding:1px 8px; }
.ft-chev{ transition:transform .18s; color:var(--c-muted); }
.ft-chev.open{ transform:rotate(90deg); }
.cat-search{ position:relative; flex:1; display:flex; align-items:center; }
.cs-icn{ position:absolute; left:11px; color:var(--c-faint); pointer-events:none; }
.cs-inp{ width:100%; height:var(--row); border:1px solid var(--c-border-strong); border-radius:var(--r-sm); padding:0 34px; font-family:var(--ui); font-size:14px; color:var(--c-text); background:var(--c-surface); }
.cs-inp:focus{ outline:none; border-color:var(--c-accent); box-shadow:0 0 0 3px var(--c-accent-t); }
.cs-clear{ position:absolute; right:8px; display:flex; border:none; background:none; color:var(--c-faint); cursor:pointer; padding:4px; border-radius:99px; }
.cs-clear:hover{ background:var(--c-surface-2); color:var(--c-text); }

/* active filters */
.active-filters{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:13px; }
.clear-all{ background:none; border:none; cursor:pointer; font-size:12px; color:var(--c-muted); text-decoration:underline; padding:0 4px; }
.clear-all:hover{ color:var(--c-text); }

/* filter families + chips */
.filter-fams{ display:flex; flex-direction:column; gap:11px; margin-top:14px; padding-top:14px; border-top:1px solid var(--c-border); }
.fam{ display:flex; align-items:flex-start; gap:12px; }
.fam-l{ flex:none; width:64px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--c-faint); padding-top:6px; }
.fam-chips{ display:flex; flex-wrap:wrap; gap:7px; flex:1; }
.chip{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--c-border-strong); background:var(--c-surface);
  border-radius:99px; padding:4px 11px; font-size:12.5px; font-weight:500; color:var(--c-text-2); cursor:pointer; transition:all .14s; white-space:nowrap; }
.chip:hover{ border-color:var(--c-muted); }
.chip-n{ font-family:var(--mono); font-size:11px; color:var(--c-faint); }
.chip.on{ background:var(--c-accent-t); border-color:var(--c-accent); color:var(--c-accent-d); font-weight:600; border-width:1.5px; }
.chip.chip-ext.on{ background:color-mix(in oklab,var(--c-violet) 12%,#fff); border-color:var(--c-violet); color:var(--c-violet); }
.chip.dis{ opacity:.4; cursor:not-allowed; }
.chip.act{ background:var(--c-accent-t); border-color:var(--c-accent); color:var(--c-accent-d); font-weight:600; gap:6px; }
.chip.act .icn{ opacity:.7; }

/* lane badge */
.lane-badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 9px; border-radius:99px; white-space:nowrap; line-height:1.5; }
.lane-standard{ background:color-mix(in oklab,var(--c-blue) 10%,#fff); color:var(--c-blue); border:1px solid color-mix(in oklab,var(--c-blue) 25%,#fff); }
.lane-extension{ background:color-mix(in oklab,var(--c-violet) 11%,#fff); color:var(--c-violet); border:1px solid color-mix(in oklab,var(--c-violet) 28%,#fff); }
.lane-dot{ width:6px; height:6px; border-radius:99px; background:var(--c-violet); }
.lane-legend{ display:flex; gap:7px; }

/* model-grouped accordion */
.cat-acc{ display:flex; flex-direction:column; }
.mgrp{ border-bottom:1px solid var(--c-border); }
.mgrp:last-child{ border-bottom:none; }
.mgrp-h{ display:flex; align-items:center; gap:11px; width:100%; border:none; background:none; cursor:pointer;
  padding:13px var(--pad); text-align:left; }
.mgrp-h:hover{ background:var(--c-surface-2); }
.mg-chev{ color:var(--c-muted); transition:transform .18s; flex:none; }
.mg-chev.open{ transform:rotate(90deg); }
.mgrp-n{ font-weight:700; font-size:14px; color:var(--c-text); white-space:nowrap; }
.mgrp-id{ font-size:11.5px; color:var(--c-faint); }
.mgrp-c{ margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--c-muted); background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:99px; padding:1px 9px; }
.mgrp-b{ padding:2px 0 8px; }

/* point row */
.pt-wrap{ border-top:1px solid var(--c-border); }
.mgrp-b .pt-wrap:first-child{ border-top:none; }
.pt-row{ display:flex; align-items:center; gap:12px; padding:8px var(--pad) 8px calc(var(--pad) + 14px); }
.pt-row:hover{ background:var(--c-surface-2); }
.pt-row.on{ background:color-mix(in oklab,var(--c-accent) 5%,#fff); }
.pt-main{ flex:1; min-width:0; cursor:pointer; }
.pt-name{ font-size:13.5px; font-weight:600; color:var(--c-text); display:flex; align-items:baseline; gap:7px; }
.pt-unit{ font-family:var(--mono); font-size:11px; color:var(--c-faint); font-weight:500; }
.pt-meta{ display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:3px; }
.pm{ font-size:11px; color:var(--c-muted); }
.pt-mrid{ font-size:11.5px; color:var(--c-text-2); background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:5px; padding:2px 8px; white-space:nowrap; }
.pt-mrid.ext{ color:var(--c-violet); background:color-mix(in oklab,var(--c-violet) 8%,#fff); border-color:color-mix(in oklab,var(--c-violet) 22%,#fff); }
.pt-info{ flex:none; display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:var(--r-sm);
  border:1px solid transparent; background:none; color:var(--c-faint); cursor:pointer; }
.pt-info:hover{ background:var(--c-surface); border-color:var(--c-border); color:var(--c-text-2); }
.pt-info.on{ background:var(--c-accent-t); color:var(--c-accent-d); }
.pt-desc{ font-size:12.5px; color:var(--c-muted); line-height:1.6; padding:0 var(--pad) 12px calc(var(--pad) + 52px); max-width:760px; }

/* ============ CONFIG ============ */
.grid-config{ display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); align-items:start; }
.span-conn{ grid-column:1/-1; } .span-env{ grid-column:1/-1; } .span-danger{ grid-column:1/-1; }
.conn-mode{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.conn-now{ padding-bottom:2px; }
.conn-dots{ display:flex; gap:24px; flex-wrap:wrap; padding:14px 0; border-top:1px solid var(--c-border); border-bottom:1px solid var(--c-border); margin-bottom:16px; }
.conn-dot{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--c-text-2); }
.conn-dot code{ font-family:var(--mono); font-size:12px; color:var(--c-muted); background:var(--c-surface-2); padding:2px 7px; border-radius:5px; }
.fix-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.cad{ display:flex; flex-direction:column; gap:16px; }
.cad-row{ display:flex; flex-direction:column; gap:8px; }
.cad-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.cad-l{ font-size:12.5px; font-weight:600; color:var(--c-text-2); }
.cad-env{ font-family:var(--mono); font-size:11px; color:var(--c-faint); }
.cad-ctl{ display:flex; align-items:center; gap:14px; }
.cad-ctl .range{ flex:1; }
.range:disabled{ opacity:.4; cursor:not-allowed; }
/* ============ DEVELOPER GUIDE ============ */
.grid-guide{ display:flex; flex-direction:column; gap:var(--gap); max-width:940px; }
.gstep-h{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.gstep-n{ width:30px; height:30px; flex:none; border-radius:99px; background:var(--c-accent-t); color:var(--c-accent-d);
  font-family:var(--mono); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; }
.gstep-t{ font-size:15px; font-weight:700; letter-spacing:-.01em; }
.gstep .prose + .prose{ margin-top:7px; }
.gstep-foot{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
.conn-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.probe-msg{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--c-muted); }
.probe-msg[data-ok="true"]{ color:var(--c-accent-d); }
.probe-msg[data-ok="false"]{ color:var(--c-blue); }

/* ============ POINTS DRAWER ============ */
.drawer-overlay{ position:fixed; inset:0; background:rgba(12,31,22,.42); display:flex; justify-content:flex-end; z-index:60; animation:fade .12s ease-out; }
.drawer{ width:620px; max-width:100%; background:var(--c-surface); height:100%; display:flex; flex-direction:column; box-shadow:var(--sh-2); }
.drawer-h{ display:flex; align-items:center; gap:10px; padding:var(--pad); border-bottom:1px solid var(--c-border); }
.drawer-h h3{ font-size:15px; font-weight:700; } .drawer-x{ margin-left:auto; border:1px solid transparent; background:none; cursor:pointer; padding:6px; border-radius:var(--r-sm); color:var(--c-muted); }
.drawer-x:hover{ background:var(--c-surface-2); color:var(--c-text); }
.drawer-tools{ display:flex; flex-direction:column; gap:10px; padding:var(--pad); border-bottom:1px solid var(--c-border); }
.drawer-detail{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--c-muted); }
.drawer-body{ flex:1; overflow-y:auto; }
.drawer-foot{ display:flex; align-items:center; gap:12px; padding:var(--pad); border-top:1px solid var(--c-border); }
.drawer-foot .cnt{ font-size:13px; font-weight:600; } .drawer-foot .sp{ margin-left:auto; }
.fam-row{ display:flex; align-items:center; gap:10px; padding:7px var(--pad) 7px calc(var(--pad) + 14px); background:color-mix(in oklab,var(--c-violet) 4%,#fff); }
.fam-all{ margin-left:auto; font-size:11px; font-weight:700; color:var(--c-violet); border:1px solid color-mix(in oklab,var(--c-violet) 30%,#fff); border-radius:99px; padding:1px 9px; background:#fff; cursor:pointer; }

/* ============ WIRE LOG ============ */
.wire{ display:flex; flex-direction:column; height:100%; min-height:0; background:var(--c-surface);
  border:1px solid var(--c-border); border-radius:var(--r); overflow:hidden; }
.wire.compact{ border:none; border-radius:0; }
.wire-bar{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--c-border); flex:none; }
.wire-count{ font-family:var(--mono); font-size:11.5px; color:var(--c-faint); margin-left:auto; }
.wire-body{ display:grid; grid-template-rows:1fr auto; min-height:0; flex:1; }
.wire.compact .wire-body{ grid-template-rows:1.1fr 1fr; }
.wire:not(.compact) .wire-body{ grid-template-rows:none; grid-template-columns:1.1fr 1fr; }
.wire-list{ overflow-y:auto; border-bottom:1px solid var(--c-border); }
.wire:not(.compact) .wire-list{ border-bottom:none; border-right:1px solid var(--c-border); }
.wire-row{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:none;
  padding:8px 14px; cursor:pointer; border-bottom:1px solid var(--c-border); font-size:12px; }
.wire-row:hover{ background:var(--c-surface-2); }
.wire-row.on{ background:var(--c-accent-t); }
.wr-time{ font-size:11px; color:var(--c-faint); flex:none; }
.wr-method{ font-size:11px; font-weight:600; color:var(--c-text-2); width:38px; flex:none; }
.wr-path{ font-size:11.5px; color:var(--c-text); flex:none; }
.wr-label{ font-size:11.5px; color:var(--c-muted); margin-left:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wire-detail{ overflow-y:auto; padding:14px; min-height:0; }
.wd-head{ display:flex; align-items:center; gap:9px; margin-bottom:11px; flex-wrap:wrap; }
.wd-label{ font-size:12px; color:var(--c-muted); }

/* ============ Console layout (dense + mono lean) ============ */
.app[data-direction="console"]{ --pad:16px; --gap:14px; }
.app[data-direction="console"] .topbar{ height:54px; }
.app[data-direction="console"] .card-t{ font-size:14px; }

/* resizable wire-rail splitter */
.rail-grip{ flex:none; width:6px; cursor:col-resize; background:var(--c-border); transition:background .12s; }
.rail-grip:hover{ background:var(--c-accent); }
.wirerail{ min-width:300px; max-width:820px; }

/* ============ modal ============ */
.modal-overlay{ position:fixed; inset:0; background:rgba(12,31,22,.42); display:flex; align-items:center; justify-content:center;
  padding:24px; z-index:60; animation:fade .12s ease-out; }
@keyframes fade{ from{opacity:0;} to{opacity:1;} }
.modal{ background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--r); box-shadow:var(--sh-2);
  width:560px; max-width:100%; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
.modal.wide{ width:840px; }
.modal-h{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:var(--pad) var(--pad) 14px; border-bottom:1px solid var(--c-border); }
.modal-t{ font-size:17px; font-weight:700; letter-spacing:-.01em; }
.modal-s{ font-size:12.5px; color:var(--c-muted); margin-top:3px; }
.modal-x{ flex:none; display:flex; border:1px solid transparent; background:none; color:var(--c-muted); cursor:pointer; padding:6px; border-radius:var(--r-sm); }
.modal-x:hover{ background:var(--c-surface-2); color:var(--c-text); border-color:var(--c-border); }
.modal-b{ padding:var(--pad); overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
.diagram{ background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--r-sm); padding:14px; }
.diagram svg{ display:block; }
.learn-cols{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.learn-h{ font-size:13px; font-weight:700; margin-bottom:6px; }
@media (max-width:720px){ .learn-cols{ grid-template-columns:1fr; } .modal.wide{ width:100%; } }

/* container responsiveness */
@container (max-width:880px){
  .grid-dispatch{ grid-template-columns:1fr; }
  .grid-telemetry{ grid-template-columns:1fr; }
  .grid-config{ grid-template-columns:1fr; }
  .mini2{ grid-template-columns:1fr; }
}
@media (max-width:720px){
  .tb-right{ gap:8px; } .sitechip{ display:none; }
}

/* tweaks panel niceties (panel ships its own base styles) */
.app{ scrollbar-color: var(--c-border-strong) transparent; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--c-border-strong); border-radius:99px; border:2px solid var(--c-bg); }
</style>
</head>
